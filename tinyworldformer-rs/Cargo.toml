[package]
name = "tinyworldformer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", optional = true }
libm = "0.2.16"

[features]
default = ["host"]
host = ["dep:crossterm"]  # terminal demo only; the firmware builds without it

[[bin]]
name = "tinyworldformer-rs"
path = "src/main.rs"
required-features = ["host"]
