[project]
name = "tinyworldformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebastian Nae", email = "naesebi2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[project.scripts]
tinyworldformer = "tinyworldformer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
media = [
    "manim>=0.22.0",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
]
